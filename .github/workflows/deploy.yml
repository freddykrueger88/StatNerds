name: Deploy (Prod)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/**'
      - 'docker-compose.prod.yml'
      - 'Caddyfile'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  build-check:
    name: Vorbau – Frontend/Backend bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image
        run: docker build ./backend --tag statnerds-backend:prod-check

      - name: Build frontend image (via compose)
        run: docker compose -f docker-compose.prod.yml build backend frontend

  deploy:
    name: Auf Server deployen (SSH)
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Assets auf Server kopieren
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          port:     ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   "backend,frontend,db,docker-compose.prod.yml,Caddyfile,.env.example"
          target:   ~/StatNerds

      - name: Stack auf Server neu aufbauen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          port:     ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/StatNerds
            # .env auf dem Server liegt, wird NIE vom Repo überschrieben (scp kopiert kein .env, nur .env.example)
            [ -f .env ] || cp .env.example .env
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
