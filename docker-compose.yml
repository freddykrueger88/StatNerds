services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       statnerds
      POSTGRES_USER:     statnerds
      POSTGRES_PASSWORD: statnerds
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U statnerds']
      interval: 10s
      timeout:  5s
      retries:  5

  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL:     postgresql://statnerds:statnerds@db:5432/statnerds
      NODE_ENV:         ${NODE_ENV:-production}
      ALLOWED_ORIGINS:  ${ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_API_KEY:    ${ADMIN_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      THE_SPORTSDB_KEY: ${THE_SPORTSDB_KEY:-}
      FOOTBALL_DATA_KEY:${FOOTBALL_DATA_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src  # nur src mounten, nicht node_modules überschreiben

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
